name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  portable:
    uses: ./.github/workflows/portable.yml
  release:
    needs: [test, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FreshKit-windows-x64
          path: portable-artifact
      - name: Create release archive
        run: git archive --format=zip --output="fresh-kit-${GITHUB_REF_NAME}.zip" "$GITHUB_SHA"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Windows: download fresh-kit.exe. Linux/macOS: download the ZIP. Python-related features require system Python and packages; see README."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "fresh-kit-${GITHUB_REF_NAME}.zip" portable-artifact/fresh-kit.exe --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Fresh Kit $GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "fresh-kit-${GITHUB_REF_NAME}.zip" portable-artifact/fresh-kit.exe --verify-tag --title "Fresh Kit $GITHUB_REF_NAME" --notes "$notes"
          fi
